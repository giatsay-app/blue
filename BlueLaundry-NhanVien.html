<script>// ===== Kho dữ liệu cục bộ + đồng bộ Firebase THEO TỪNG BẢN GHI =====
// Mỗi đơn hàng / giao dịch là một bản ghi riêng trên Firebase.
// Máy này sửa đơn A không bao giờ ghi đè đơn B của máy kia.
(function(){
  var KEY='laundry-slots-demo-v1', CFGKEY='laundry-sync-cfg';
  var COLS=['orders','completed','cancelled','payLog','shifts'];

  /* Một số trình duyệt chặn lưu trữ khi mở file trực tiếp từ máy.
     Khi đó dùng bộ nhớ tạm để app vẫn bán hàng được, và báo cho người dùng biết. */
  var LS = (function(){
    try {
      var t='__bl_test'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
      return localStorage;
    } catch(e){
      window.__storageBlocked = true;
      var mem={};
      return {
        getItem:function(k){ return (k in mem)?mem[k]:null; },
        setItem:function(k,v){ mem[k]=String(v); },
        removeItem:function(k){ delete mem[k]; }
      };
    }
  })();

  var cfg={};
  try { cfg = JSON.parse(LS.getItem(CFGKEY)||'{}'); } catch(e){ cfg={}; }
  var oldUrl = null;
  try { oldUrl = LS.getItem('laundry-sync-url'); } catch(e){}
  if(oldUrl && !cfg.url){ cfg.url = oldUrl; }

  var idToken=null, tokenExpiry=0;
  var syncedRecs=null;        // ảnh chụp bản ghi đã đồng bộ thành công
  var firstSyncDone=false;
  window.__syncStatus = cfg.url ? 'connecting' : 'off';

  window.__getSyncConfig = function(){
    return { url: cfg.url||'', apiKey: cfg.apiKey||'', email: cfg.email||'', secured: !!cfg.refreshToken };
  };
  function saveCfg(){ LS.setItem(CFGKEY, JSON.stringify(cfg)); }

  window.__connectSync = function(url, apiKey, email, password){
    url=(url||'').trim(); apiKey=(apiKey||'').trim(); email=(email||'').trim();
    if(!url) return Promise.resolve({ok:false,error:'Thiếu địa chỉ database'});
    if(!apiKey || !email || !password){
      cfg={url:url}; saveCfg(); window.__syncStatus='ok';
      return Promise.resolve({ok:true, insecure:true});
    }
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(apiKey),{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email:email,password:password,returnSecureToken:true})
    }).then(function(r){return r.json();}).then(function(j){
      if(j.error){
        var m=(j.error.message||'');
        var vi = m.indexOf('EMAIL_NOT_FOUND')>=0 ? 'Email chưa được tạo trong Firebase Authentication'
          : (m.indexOf('INVALID_PASSWORD')>=0 || m.indexOf('INVALID_LOGIN_CREDENTIALS')>=0) ? 'Sai email hoặc mật khẩu Firebase'
          : (m.indexOf('API_KEY')>=0 || m.indexOf('API key')>=0) ? 'Web API Key không đúng'
          : m;
        return {ok:false,error:vi};
      }
      idToken=j.idToken; tokenExpiry=Date.now()+(parseInt(j.expiresIn||'3600',10)-300)*1000;
      cfg={url:url, apiKey:apiKey, email:email, refreshToken:j.refreshToken};
      saveCfg(); window.__syncStatus='ok';
      return {ok:true};
    }).catch(function(){ return {ok:false,error:'Không kết nối được mạng'}; });
  };

  window.__disconnectSync = function(){
    cfg={}; idToken=null; syncedRecs=null; firstSyncDone=false;
    LS.removeItem(CFGKEY); LS.removeItem('laundry-sync-url');
    window.__syncStatus='off';
  };
  window.__setSyncUrl = function(u){ if(!u){ window.__disconnectSync(); return; } cfg.url=(u||'').trim(); saveCfg(); };
  window.__getSyncUrl = function(){ return cfg.url||''; };

  function ensureToken(){
    if(!cfg.refreshToken) return Promise.resolve(null);
    if(idToken && Date.now()<tokenExpiry) return Promise.resolve(idToken);
    return fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(cfg.apiKey),{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(cfg.refreshToken)
    }).then(function(r){return r.json();}).then(function(j){
      if(j.id_token){
        idToken=j.id_token;
        tokenExpiry=Date.now()+(parseInt(j.expires_in||'3600',10)-300)*1000;
        if(j.refresh_token){ cfg.refreshToken=j.refresh_token; saveCfg(); }
        return idToken;
      }
      window.__syncStatus='auth_error'; return null;
    }).catch(function(){ window.__syncStatus='error'; return null; });
  }

  function base(){
    if(!cfg.url) return null;
    var u = cfg.url.trim().replace(/\/+$/,'');
    if(!/^https?:\/\//.test(u)) u = 'https://' + u;
    return u + '/blue-laundry';
  }
  function urlFor(path, tok){
    var b=base(); if(!b) return null;
    return b + (path?('/'+path):'') + '.json' + (tok?('?auth='+encodeURIComponent(tok)):'');
  }

  /* ---- Chuẩn hóa để so sánh: bỏ null/undefined, sắp xếp khóa
         (Firebase tự bỏ trường null nên nếu không chuẩn hóa sẽ báo khác nhau oan) ---- */
  function stable(v){
    if(v===null||v===undefined) return undefined;
    if(Array.isArray(v)) return v.map(stable);
    if(typeof v==='object'){
      var out={}, keys=Object.keys(v).sort();
      for(var i=0;i<keys.length;i++){
        var sv=stable(v[keys[i]]);
        if(sv!==undefined) out[keys[i]]=sv;
      }
      return out;
    }
    return v;
  }
  function same(a,b){ return JSON.stringify(stable(a))===JSON.stringify(stable(b)); }
  function stampOf(recs){ return (recs && recs.settings && recs.settings.updatedAt) || 0; }

  function keyOf(item, col){
    if(item && item.id) return String(item.id).replace(/[.#$\[\]\/]/g,'_');
    // Giao dịch cũ chưa có id: sinh khóa ổn định để 2 máy không tạo bản trùng
    if(col==='payLog') return ('p_'+(item.at||0)+'_'+(item.orderId||item.code||'x')+'_'+(item.amount||0)).replace(/[.#$\[\]\/]/g,'_');
    return null;
  }

  /* blob (app) -> bản ghi theo khóa (Firebase) */
  function toRecords(blob){
    var recs={settings:blob.settings||null, counter:blob.counter||null};
    COLS.forEach(function(col){
      var m={};
      (blob[col]||[]).forEach(function(item){
        var k=keyOf(item,col);
        if(k) m[k]=item;
      });
      recs[col]=m;
    });
    return recs;
  }

  /* bản ghi (Firebase) -> blob (app), giữ đúng thứ tự hiển thị */
  function fromRecords(recs){
    function list(col){ var m=recs[col]||{}; return Object.keys(m).map(function(k){return m[k];}).filter(Boolean); }
    var byNewest=function(a,b){ return (b.createdAt||b.at||b.end||0)-(a.createdAt||a.at||a.end||0); };
    return {
      orders: list('orders').sort(byNewest),
      completed: list('completed').sort(function(a,b){return (b.finishedAt||0)-(a.finishedAt||0);}),
      cancelled: list('cancelled').sort(function(a,b){return (b.cancelledAt||0)-(a.cancelledAt||0);}),
      payLog: list('payLog').sort(function(a,b){return (a.at||0)-(b.at||0);}),
      shifts: list('shifts').sort(function(a,b){return (b.end||0)-(a.end||0);}),
      settings: recs.settings||undefined,
      counter: recs.counter||undefined
    };
  }

  /* Chỉ gửi những bản ghi THỰC SỰ thay đổi */
  function diffPatch(oldR, newR){
    var patch={}, n=0;
    COLS.forEach(function(col){
      var o=(oldR&&oldR[col])||{}, w=(newR&&newR[col])||{};
      Object.keys(w).forEach(function(k){
        if(!same(o[k], w[k])){ patch[col+'/'+k]=w[k]; n++; }
      });
      Object.keys(o).forEach(function(k){
        if(!(k in w)){ patch[col+'/'+k]=null; n++; }   // bản ghi đã chuyển đi/bị xóa
      });
    });
    if(newR.settings && !same(oldR&&oldR.settings, newR.settings)){
      /* Không đẩy đè khi bản của máy này CŨ HƠN bản trên mạng — chống máy giữ bản cũ ghi ngược */
      if(stampOf(newR) >= stampOf(oldR)){ patch['settings']=newR.settings; n++; }
    }
    if(newR.counter && (!oldR || oldR.counter!==newR.counter)){ patch['counter']=newR.counter; n++; }
    return n?patch:null;
  }

  window.storage = {
    get: function(k){ var v=LS.getItem(k); return Promise.resolve(v?{value:v}:null); },
    set: function(k,v){ LS.setItem(k,v); if(k===KEY) schedulePush(); return Promise.resolve({key:k}); },
    "delete": function(k){ LS.removeItem(k); return Promise.resolve({key:k}); },
    list: function(){ return Promise.resolve({keys:Object.keys(localStorage)}); }
  };

  var pushTimer=null, pushing=false;
  function schedulePush(){
    if(!cfg.url || !firstSyncDone) return;
    clearTimeout(pushTimer);
    pushTimer=setTimeout(function(){ pushLocal(); }, 700);
  }

  function localBlob(){
    var v=LS.getItem(KEY);
    if(!v) return null;
    try { return JSON.parse(v); } catch(e){ return null; }
  }

  function pushLocal(){
    if(pushing || !cfg.url) return Promise.resolve();
    var blob=localBlob(); if(!blob) return Promise.resolve();
    var recs=toRecords(blob);
    var patch=diffPatch(syncedRecs, recs);
    if(!patch){ syncedRecs=recs; return Promise.resolve(); }
    pushing=true;
    return ensureToken().then(function(tok){
      return fetch(urlFor('', tok), {
        method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch)
      }).then(function(r){
        pushing=false;
        if(!r.ok){
          window.__syncStatus = (r.status===401||r.status===403) ? 'auth_error'
            : (r.status===400) ? 'rules_error' : 'error';
          return false;   // giữ nguyên dữ liệu máy, sẽ thử lại chu kỳ sau
        }
        syncedRecs=recs;              // chỉ đánh dấu đã đồng bộ khi server nhận thật
        window.__syncStatus='ok';
        return true;
      });
    }).catch(function(){ pushing=false; window.__syncStatus='error'; return false; });
  }

  function adoptRemote(remote){
    var blob=fromRecords(remote);
    var local=localBlob()||{};
    /* Cài đặt: bên nào sửa sau cùng thì giữ bên đó */
    var localStamp=(local.settings && local.settings.updatedAt)||0;
    var remoteStamp=(blob.settings && blob.settings.updatedAt)||0;
    if(local.settings && localStamp>remoteStamp) blob.settings=local.settings;
    // giữ lại phần app cần nhưng không đồng bộ (ví dụ counter cũ)
    if(blob.settings===undefined) delete blob.settings;
    if(blob.counter===undefined) delete blob.counter;
    var merged=JSON.stringify(Object.assign({}, local, blob));
    if(merged!==LS.getItem(KEY)){
      LS.setItem(KEY, merged);
      window.dispatchEvent(new CustomEvent('cloudsync',{detail:merged}));
    }
    syncedRecs=toRecords(JSON.parse(merged));
  }

  function normalizeRemote(raw){
    var recs={settings:null,counter:null};
    COLS.forEach(function(c){ recs[c]=(raw&&raw[c])||{}; });
    if(raw&&raw.settings) recs.settings=raw.settings;
    if(raw&&raw.counter) recs.counter=raw.counter;
    return recs;
  }
  function isEmpty(recs){
    return COLS.every(function(c){ return Object.keys(recs[c]||{}).length===0; }) && !recs.settings;
  }

  /* Còn thay đổi của mình chưa kịp đẩy lên? */
  function hasPendingLocal(){
    var blob=localBlob();
    if(!blob) return false;
    return !!diffPatch(syncedRecs, toRecords(blob));
  }

  function sync(){
    if(!cfg.url) return;
    /* THỨ TỰ QUAN TRỌNG: đẩy thay đổi của mình LÊN TRƯỚC, rồi mới tải bản mới nhất về.
       Làm ngược lại sẽ khiến thứ vừa gõ bị bản cũ trên mạng đè lại. */
    var pushFirst = firstSyncDone ? pushLocal() : Promise.resolve();
    pushFirst.then(function(){
      return ensureToken();
    }).then(function(tok){
      return fetch(urlFor('', tok)).then(function(r){
        if(!r.ok){ window.__syncStatus=(r.status===401||r.status===403)?'auth_error':'error'; return null; }
        return r.json();
      });
    }).then(function(raw){
      if(raw===undefined) return;
      if(raw===null && window.__syncStatus!=='ok' && window.__syncStatus!=='connecting') return;
      window.__syncStatus='ok';

      // Chuyển dữ liệu từ định dạng cũ (một gói lớn) sang từng bản ghi
      if(raw && typeof raw.data==='string'){
        var old;
        try { old=JSON.parse(raw.data); } catch(e){ old=null; }
        if(old){
          var oldRecs=toRecords(old);
          /* Gộp thêm dữ liệu đang có trên máy này để không mất đơn nào */
          var mine=localBlob();
          if(mine){
            var myRecs=toRecords(mine);
            COLS.forEach(function(c){
              Object.keys(myRecs[c]||{}).forEach(function(k){ if(!oldRecs[c][k]) oldRecs[c][k]=myRecs[c][k]; });
            });
            if(mine.settings && (mine.settings.updatedAt||0) > ((oldRecs.settings&&oldRecs.settings.updatedAt)||0)) oldRecs.settings=mine.settings;
          }
          var patch=diffPatch(null, oldRecs) || {};
          patch['data']=null; patch['updatedAt']=null;
          return ensureToken().then(function(t2){
            return fetch(urlFor('', t2),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
          }).then(function(r2){
            if(!r2.ok){
              /* Firebase từ chối ghi (thường do Security Rules chưa cập nhật).
                 TUYỆT ĐỐI không áp dữ liệu cũ đè lên máy — sẽ làm mất đơn vừa tạo. */
              window.__syncStatus = (r2.status===401||r2.status===403) ? 'auth_error' : 'rules_error';
              return;
            }
            firstSyncDone=true;
            syncedRecs=oldRecs;
            adoptRemote(oldRecs);
          });
        }
      }

      var remote=normalizeRemote(raw);

      if(!firstSyncDone){
        firstSyncDone=true;
        if(isEmpty(remote)){
          syncedRecs=null;          // cloud trống: đẩy dữ liệu máy này lên làm bản gốc
          return pushLocal();
        }
        adoptRemote(remote);        // cloud đã có dữ liệu: lấy về, KHÔNG đè bằng dữ liệu cũ của máy
        return;
      }

      /* Người dùng vừa thao tác trong lúc đang tải về (ví dụ đang gõ tên tiệm, vừa tạo đơn)
         → để nguyên, chu kỳ sau đẩy lên rồi mới hợp nhất. Không bao giờ đè lên thứ họ vừa nhập. */
      if(hasPendingLocal()) return;
      /* Lần ghi gần nhất bị Firebase từ chối → dữ liệu máy chưa lên được,
         áp bản trên mạng lúc này sẽ xóa mất đơn vừa tạo. */
      if(window.__syncStatus==='rules_error' || window.__syncStatus==='auth_error') return;

      adoptRemote(remote);
    }).catch(function(){ window.__syncStatus='error'; });
  }

  setInterval(sync, 5000);
  setTimeout(sync, 800);
  window.addEventListener('online', function(){ setTimeout(sync, 500); });

  // ===== In máy in nhiệt K80 (80mm) =====
  function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function fmtD(n){ return (n||0).toLocaleString('vi-VN') + '\u0111'; }
  function lb(it){ return Math.round(it.qty*it.price); }
  function ld(it){
    var b=lb(it);
    if(it.discountType==='percent') return Math.min(b, Math.round(b*(it.discountValue||0)/100));
    if(it.discountType==='amount') return Math.min(b, it.discountValue||0);
    return 0;
  }
  /* ===== Dựng nội dung bill theo mẫu đã chốt ===== */
  function buildReceiptHTML(order, template, paid){
    paid = paid || 0;
    var balance = (order.total||0) - paid;
    var blocks=(template&&template.blocks)||[];
    var bi=!!(template&&template.bilingual);
    var copies=(template&&template.copies===1)?1:2;
    var paper=(template&&template.paperWidth===58)?58:80;
    var inner=paper-6;
    var fsBase = paper===58 ? 10 : 12;
    var fsSm   = paper===58 ? 9  : 11;
    var fsHd   = paper===58 ? 8  : 9;
    function L(vi,en){ return bi ? (vi+' / '+en) : vi; }
    function L2(vi,en){ return bi ? (vi+'<br>'+en) : vi; }   /* hai tầng cho ô tiêu đề cột */

    function renderBlocks(area){
      return blocks.filter(function(b){return b.area===area;}).map(function(b){
        var align=b.align||'center';
        if(b.type==='divider') return '<div style="border-top:1px dashed #666;margin:4px 0"></div>';
        if(b.type==='logo') return b.src?('<div style="text-align:'+align+'"><img src="'+b.src+'" style="width:'+(b.width||55)+'%"/></div>'):'';
        if(b.type==='contact') return '<div style="text-align:'+align+';font-size:'+fsSm+'px'+(b.bold?';font-weight:700':'')+'">'+(b.label?esc(b.label)+': ':'')+esc(b.content)+'</div>';
        var size=b.size==='lg'?(paper===58?14:17):b.size==='sm'?fsSm:(paper===58?11:13);
        return '<div style="text-align:'+align+';font-size:'+size+'px;font-weight:'+(b.bold?'700':'400')+';white-space:pre-wrap;letter-spacing:.5px">'+esc(b.content)+'</div>';
      }).join('');
    }

    /* Bảng dịch vụ có kẻ khung đầy đủ */
    var rows=(order.items||[]).map(function(it){
      var disc=ld(it);
      var r='<tr>'+
        '<td class="c1">'+esc(it.name)+'</td>'+
        '<td class="c2">'+it.qty+'</td>'+
        '<td class="c3">'+fmtD(it.price)+'</td>'+
        '<td class="c4">'+fmtD(lb(it))+'</td>'+
      '</tr>';
      if(disc>0){
        var lbl=it.discountType==='percent'?(L('Chi\u1ebft kh\u1ea5u','Discount')+' '+it.discountValue+'%'):L('Gi\u1ea3m gi\u00e1','Discount');
        r+='<tr><td class="c1" colspan="3" style="font-style:italic">'+lbl+'</td><td class="c4">\u2212'+fmtD(disc)+'</td></tr>';
      }
      return r;
    }).join('');
    if(order.delivery && order.delivery.fee>0){
      rows+='<tr><td class="c1" colspan="3">'+L('Giao t\u1eadn n\u01a1i','Delivery')+'</td>'+
            '<td class="c4">'+fmtD(order.delivery.fee)+'</td></tr>';
    }

    var payBox='<div class="paybox">'+
      (paid>0?'<div class="row"><span>'+L('\u0110\u00e3 tr\u1ea3','Paid')+'</span><span style="font-weight:700">'+fmtD(paid)+'</span></div>':'')+
      (balance>0
        ? '<div class="row big"><span>'+L('C\u00d2N THU','DUE')+'</span><span>'+fmtD(balance)+'</span></div>'
        : balance<0
          ? '<div class="row big"><span>'+L('HO\u00c0N KH\u00c1CH','REFUND')+'</span><span>'+fmtD(-balance)+'</span></div>'
          : '<div class="row big"><span>'+L('\u0110\u00c3 THU \u0110\u1ee6','PAID IN FULL')+'</span><span>'+(order.pay==='cash'?L('Ti\u1ec1n m\u1eb7t','Cash'):order.pay==='bank'?L('Chuy\u1ec3n kho\u1ea3n','Transfer'):'')+'</span></div>')+
      '</div>';

    function oneCopy(copyLabel){
      return '<div class="cp">'+
        renderBlocks('header')+
        '<div class="title">'+L('BI\u00caN NH\u1eacN','RECEIPT')+'</div>'+
        '<table class="info"><tr>'+
          '<td>'+
            '<div class="cus">'+esc(order.customerName)+'</div>'+
            (order.phone?'<div>'+esc(order.phone)+'</div>':'')+
            '<div>'+esc(order.code)+' \u00b7 '+new Date(order.createdAt).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div>'+
            (order.staff?'<div>NV: '+esc(order.staff)+'</div>':'')+
          '</td>'+
          '<td class="mbox"><div class="mb">'+
            '<div class="ml">'+L('M\u00c1Y','MACH.')+'</div>'+
            '<div class="mn">'+order.slot+'</div>'+
          '</div></td>'+
        '</tr></table>'+
        '<table class="tb">'+
          '<tr class="hd">'+
            '<th class="c1">'+L2('D\u1ecbch v\u1ee5','Item')+'</th>'+
            '<th class="c2">'+L2('SL','Qty')+'</th>'+
            '<th class="c3">'+L2('\u0110\u01a1n gi\u00e1','Price')+'</th>'+
            '<th class="c4">'+L2('T.ti\u1ec1n','Amount')+'</th>'+
          '</tr>'+ rows +
        '</table>'+
        '<div class="total"><span>'+L('T\u1ed4NG','TOTAL')+'</span><span>'+fmtD(order.total)+'</span></div>'+
        payBox+
        (order.delivery?'<div class="dl">\u2192 '+L('Giao','Delivery')+' '+esc(order.delivery.time)+' \u00b7 '+esc(order.delivery.address)+'</div>':'')+
        (order.note?'<div class="note">'+L('Ghi ch\u00fa','Note')+': '+esc(order.note)+'</div>':'')+
        renderBlocks('footer')+
        (copyLabel?'<div class="cl">'+copyLabel+'</div>':'')+
      '</div>';
    }

    var content = copies===2
      ? oneCopy(L('LI\u00caN 1 \u2014 Kh\u00e1ch gi\u1eef','COPY 1'))+
        '<div class="cut">\u2702 - - - - - - - - - - - - - -</div>'+
        oneCopy(L('LI\u00caN 2 \u2014 Ghim t\u00fai \u0111\u1ed3','COPY 2'))
      : oneCopy('');

    return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+
      '@page{size:'+paper+'mm auto;margin:0}'+
      '*{box-sizing:border-box}'+
      'html,body{width:100%;margin:0;padding:0}'+
      'body{max-width:'+inner+'mm;margin:0 auto;font-family:"Courier New",monospace;font-size:'+fsBase+'px;'+
        'color:#000;padding:3mm 0;-webkit-print-color-adjust:exact;print-color-adjust:exact;word-wrap:break-word}'+
      'img{max-width:100%;height:auto}'+
      '.title{text-align:center;margin:6px 0 5px;padding:3px 0;border-top:1px dashed #666;border-bottom:1px dashed #666;'+
        'font-size:'+(paper===58?11:13)+'px;font-weight:700;letter-spacing:1px}'+
      'table{width:100%;border-collapse:collapse;table-layout:fixed}'+
      '.info td{vertical-align:top;font-size:'+fsSm+'px;padding:0}'+
      '.info .cus{font-size:'+(paper===58?11:13)+'px;font-weight:700}'+
      '.info .mbox{width:26%;text-align:right}'+
      '.mb{border:2px solid #000;border-radius:4px;padding:1px 5px;display:inline-block;text-align:center}'+
      '.ml{font-size:'+(paper===58?7:9)+'px;letter-spacing:.5px;font-weight:700}'+
      '.mn{font-size:'+(paper===58?20:26)+'px;font-weight:800;line-height:1.05}'+
      '.tb{margin-top:6px}'+
      '.tb th,.tb td{border:1px solid #000;padding:3px 3px;word-break:break-word}'+
      '.tb .hd th{font-size:'+fsHd+'px;font-weight:700;text-align:left;line-height:1.25}'+
      '.tb td{font-size:'+fsSm+'px}'+
      '.tb .c1{width:40%}.tb .c2{width:13%;text-align:center}.tb .c3{width:23%;text-align:right}'+
      '.tb .c4{width:24%;text-align:right;font-weight:700}'+
      '.tb .hd .c2{text-align:center}.tb .hd .c3,.tb .hd .c4{text-align:right}'+
      '.total{display:flex;justify-content:space-between;margin-top:6px;padding-top:5px;border-top:2px solid #000;'+
        'font-size:'+(paper===58?13:15)+'px;font-weight:800}'+
      '.paybox{margin-top:5px;border:1px dashed #000;padding:4px 6px;font-size:'+fsSm+'px}'+
      '.paybox .row{display:flex;justify-content:space-between}'+
      '.paybox .big{font-size:'+(paper===58?11:13)+'px;font-weight:800}'+
      '.dl{margin-top:5px;font-size:'+fsSm+'px;font-weight:700}'+
      '.note{margin-top:3px;font-size:'+fsSm+'px}'+
      '.cl{text-align:center;font-size:'+(paper===58?8:10)+'px;font-weight:700;margin-top:5px}'+
      '.cut{text-align:center;font-size:10px;margin:7px 0}'+
      '@media print{html,body{width:auto}}'+
      '</style></head><body>'+content+'</body></html>';
  }

  /* Chuyển bill sang dạng CHỮ THUẦN để gửi thẳng máy in — in tức thì, tự cắt giấy */
  function buildReceiptText(order, template, paid){
    paid = paid || 0;
    var balance=(order.total||0)-paid;
    var bi=!!(template&&template.bilingual);
    var paper=(template&&template.paperWidth===58)?58:80;
    var W = paper===58 ? 32 : 48;           /* số ký tự mỗi dòng */
    var blocks=(template&&template.blocks)||[];
    function L(vi,en){ return bi?(vi+' / '+en):vi; }
    function center(t){ t=String(t); if(t.length>=W) return t; var pad=Math.floor((W-t.length)/2); return new Array(pad+1).join(' ')+t; }
    function line(ch){ return new Array(W+1).join(ch||'-'); }
    function money(n){ return (n||0).toLocaleString('vi-VN'); }
    function two(l,r){ l=String(l); r=String(r); var sp=W-l.length-r.length; if(sp<1) sp=1; return l+new Array(sp+1).join(' ')+r; }
    var wq=4, wp=paper===58?8:10, wt=paper===58?9:11;
    var wn=W-wq-wp-wt-3;                      /* bề rộng cột tên dịch vụ */
    function pad(t,w,right){
      t=String(t);
      if(t.length>w) t=t.slice(0,w);          /* cắt phần ĐUÔI, giữ đầu chữ cho dễ đọc */
      var sp=new Array(w-t.length+1).join(' ');
      return right?(sp+t):(t+sp);
    }
    function cols(a,b,c,d){   /* tên | SL | đơn giá | thành tiền */
      return pad(a,wn)+' '+pad(b,wq,true)+' '+pad(c,wp,true)+' '+pad(d,wt,true);
    }
    /* Tên dài thì xuống dòng riêng thay vì cắt cụt */
    function itemLines(name, qty, price, amount){
      name=String(name);
      if(name.length<=wn) return [cols(name,qty,price,amount)];
      var out=[], rest=name;
      while(rest.length>wn){
        var cut=rest.lastIndexOf(' ', wn);
        if(cut<=0) cut=wn;
        out.push(rest.slice(0,cut));
        rest=rest.slice(cut).replace(/^ +/,'');
      }
      out.push(cols(rest,qty,price,amount));
      return out;
    }
    var out=[];
    blocks.filter(function(b){return b.area==='header';}).forEach(function(b){
      if(b.type==='divider'){ out.push(line('-')); return; }

/* Chuẩn hóa cài đặt: bổ sung trường mới, chuyển mẫu in kiểu cũ sang dạng khối.
   Dùng cho CẢ lúc mở app lẫn lúc nhận dữ liệu từ đồng bộ — nếu bỏ sót một chỗ,
   mẫu in kiểu cũ sẽ làm hỏng trình dựng hóa đơn. */
function normalizeSettings(raw) {
  const st = {
    ...DEFAULT_SETTINGS,
    ...(raw || {})
  };
  st.updatedAt = raw && raw.updatedAt || 0;
  const baseStaff = st.staff && st.staff.length ? st.staff : APP_MODE === "merged" ? STAFF : [];
  st.staff = baseStaff.map((x, i) => {
    const autoName = stripVN(x.name) || "nv" + (i + 1);
    const badAuto = !x.username || /^nv\d+$/.test(x.username);
    return {
      ...x,
      username: badAuto ? autoName : x.username,
      password: x.password || x.pin || ""
    };
  });
  st.managerPassword = st.managerPassword || st.managerPin || "";
  st.services = st.services && st.services.length ? st.services : SERVICES;
  st.notify = {
    ...DEFAULT_SETTINGS.notify,
    ...(st.notify || {})
  };
  const r = st.receipt;
  if (!r || !r.blocks || !r.blocks.length) {
    const blocks = [];
    if (r && r.shopName) blocks.push({
      id: "m1",
      area: "header",
      type: "text",
      content: r.shopName,
      align: "center",
      bold: true,
      size: "lg"
    });
    if (r && r.address) blocks.push({
      id: "m2",
      area: "header",
      type: "text",
      content: r.address,
      align: "center",
      bold: false,
      size: "sm"
    });
    if (r && r.hotline) blocks.push({
      id: "m3",
      area: "header",
      type: "contact",
      label: "Hotline",
      content: r.hotline,
      align: "center"
    });
    blocks.push({
      id: "m4",
      area: "footer",
      type: "divider"
    });
    if (r && r.footer) blocks.push({
      id: "m5",
      area: "footer",
      type: "text",
      content: r.footer,
      align: "center",
      bold: false,
      size: "sm"
    });
    st.receipt = {
      copies: r && r.copies || 2,
      bilingual: !!(r && r.bilingual),
      blocks: blocks.length > 1 ? blocks : DEFAULT_RECEIPT.blocks
    };
  } else {
    st.receipt = {
      copies: r.copies === 1 ? 1 : 2,
      bilingual: !!r.bilingual,
      blocks: r.blocks
    };
  }
  return st;
}
const stripVN = str => (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().replace(/[^a-z0-9]/g, "");
const fmt = n => (n || 0).toLocaleString("vi-VN") + "đ";
const lineBase = i => Math.round(i.qty * i.price);
const lineDiscount = i => {
  const base = lineBase(i);
  if (i.discountType === "percent") return Math.min(base, Math.round(base * (i.discountValue || 0) / 100));
  if (i.discountType === "amount") return Math.min(base, i.discountValue || 0);
  return 0;
};
const lineTotal = i => lineBase(i) - lineDiscount(i);

/* ===== Gửi thông báo Telegram =====
   Gọi thẳng Telegram Bot API từ trình duyệt, không cần máy chủ.
   Thất bại (mất mạng, sai mã) thì bỏ qua im lặng — không được chặn thao tác bán hàng. */
function sendNotify(settings, kind, text) {
  try {
    const n = settings && settings.notify;
    if (!n || !n.enabled || !n.botToken || !n.chatId) return;
    const map = {
      payment: n.onPayment,
      refund: n.onRefund,
      cancel: n.onCancel,
      neworder: n.onNewOrder,
      late: n.onLateDelivery,
      shift: n.onShift,
      test: true
    };
    if (!map[kind]) return;
    telegramSend(n.botToken, n.chatId, text).catch(() => {});
  } catch {/* không bao giờ làm hỏng luồng bán hàng */}
}

/* Gửi bằng GET + tham số trên đường dẫn.
   KHÔNG dùng POST kèm Content-Type: application/json — khi app mở từ file trên máy,
   trình duyệt sẽ chặn trước khi gửi (CORS preflight) và tin nhắn không bao giờ tới. */
function telegramSend(token, chatId, text) {
  const q = new URLSearchParams({
    chat_id: String(chatId).trim(),
    text: String(text),
    parse_mode: "HTML",
    disable_web_page_preview: "true"
  });
  const url = `https://api.telegram.org/bot${String(token).trim()}/sendMessage?${q.toString()}`;
  return fetch(url).then(r => r.json()).then(j => {
    window.__notifyLast = {
      at: Date.now(),
      ok: !!j.ok,
      error: j.ok ? null : j.description || "Không rõ lỗi"
    };
    return j;
  }).catch(e => {
    window.__notifyLast = {
      at: Date.now(),
      ok: false,
      error: "Không gửi được (mất mạng hoặc bị chặn)"
    };
    throw e;
  });
}

/* ===== Công nợ theo đơn =====
   payLog: PAYMENT lưu số dương, REFUND (hoàn tiền) lưu số ÂM
   → cộng dồn ra ngay số tiền thực đã thu của đơn, và doanh thu thực của tiệm */
const payEntriesOf = (order, payLog) => (payLog || []).filter(e => e.orderId ? e.orderId === order.id : e.code === order.code);
const paidOf = (order, payLog) => payEntriesOf(order, payLog).reduce((s, e) => s + e.amount, 0);
const balanceOf = (order, payLog) => (order.total || 0) - paidOf(order, payLog);
/* > 0: khách còn nợ · < 0: tiệm phải hoàn lại khách · = 0: xong */

};
const startOfToday = () => {

function elapsedStr(t) {
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return "vừa xong";
  if (m < 60) return `${m} phút`;
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return mm > 0 ? `${h}g${mm}p` : `${h} giờ`;
}

/* Mã đơn dạng GS-YYYYMMDD-NNN, số thứ tự tính theo đơn trong ngày,
   tự nhảy tiếp nếu mã đã tồn tại (chống trùng khi nhiều máy cùng tạo) */
function nextOrderCode(allOrders) {
  const d = new Date();
  const day = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  const prefix = `GS-${day}-`;
  const used = new Set(allOrders.map(o => o.code));
  let n = allOrders.filter(o => (o.code || "").startsWith(prefix)).length + 1;
  while (used.has(prefix + String(n).padStart(3, "0"))) n += 1;
  return prefix + String(n).padStart(3, "0");
}
